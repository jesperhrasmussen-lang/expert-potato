name: Audit offer coverage

on:
  push:
    branches: ["claude/**"]
    paths-ignore:
      - "results/**"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt 2>/dev/null || true

      - name: Create results directory
        run: mkdir -p results

      - name: Search broccoli offers
        run: python3 scripts/etilbudsavis_collect.py "broccoli" --pretty | tee results/broccoli.json

      - name: Run full coverage audit
        run: python3 scripts/audit_meal_ingredient_coverage_dk.py --pretty | tee results/audit.json

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --cached --quiet || git commit -m "Update audit results [skip ci]"
          git push
